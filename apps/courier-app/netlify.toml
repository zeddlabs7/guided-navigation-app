  from = "/api/loadGuidanceData"
  to = "https://loadguidancedata-txrb6jqctq-wx.a.run.app"
  status = 200
  force = true

[[redirects]]
  from = "/api/translateTexts"
  to = "https://translatetexts-txrb6jqctq-wx.a.run.app"
  status = 200
  force = true
